name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the older run pointless. Agents and humans both push
# in quick succession; paying for superseded runs helps neither.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything that answers in seconds, so a bad push is caught before the
  # slow job has finished booting a database.
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the range, not just the tip.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Types
        run: pnpm typecheck

      # `--format=github` emits workflow annotations, so a finding lands on
      # the diff line instead of only in the log.
      - name: Lint
        run: pnpm exec oxlint --format=github .

      - name: Formatting
        run: pnpm fmt:check

      - name: Architecture
        run: pnpm architecture

      # Unused files, exports and dependencies.
      - name: Dead code (knip)
        run: pnpm knip

      # Fails on high and critical. Moderate findings are reported by the
      # scheduled CodeQL run rather than blocking every push.
      - name: Audit
        run: pnpm audit --audit-level=high

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # The slow, honest one: real migrations over PGlite and real Stockfish at
  # shallow depth. Nothing is mocked away, which is the point.
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Tests
        run: pnpm test

      - name: End-to-end
        run: pnpm e2e

      - name: Build
        run: pnpm build

  # The browser one: a real Chromium running the app's own Stockfish WASM and
  # IndexedDB. Only the HTTP the screen reads is staged, so it needs no
  # service container, and `vite dev` is what copies the engine assets in.
  analysis-e2e:
    name: Analysis E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Analysis, review and engine lifecycle
        run: pnpm e2e:analysis

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-analysis
          path: .playwright/test-results
          if-no-files-found: ignore

  # Races that need two real connections: locks and unique-index arbitration.
  # PGlite runs one connection, so these run against the Postgres the
  # compose file deploys.
  postgres:
    name: Postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velachess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/velachess
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Concurrency tests
        run: pnpm --filter @velachess/infra-db exec vitest run tests/concurrency.test.ts

      - name: Sync settle on the postgres-js driver
        run: pnpm --filter @velachess/infra-queue exec vitest run tests/postgres.test.ts

  # The API rate limiter has no embedded Redis fallback: `pnpm test` skips
  # its suites without `REDIS_URL`, so this is where they run.
  redis:
    name: Redis integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: API rate limiter over the real store
        run: pnpm --filter @velachess/server test
