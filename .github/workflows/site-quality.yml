name: Site quality

# Lighthouse audits the public site, so it runs only when what the site
# renders or how it is measured changed. `libs/ui` is in because the site
# renders its components, icons, theme and tokens; its chess, charts and
# layout code never reach the site. Not a required check: a required check
# under a `paths:` filter would stay pending on every other pull request.
on:
  push:
    branches: [main]
    paths: &site-inputs
      - apps/site/**
      - libs/ui/package.json
      - libs/ui/src/components/**
      - libs/ui/src/icons/**
      - libs/ui/src/lib/**
      - libs/ui/src/styles/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - turbo.json
      - .github/actions/setup/**
      - .github/workflows/site-quality.yml
      - "!**/*.md"
      - "!**/tests/**"
      - "!**/*.test.ts"
      - "!**/*.test.tsx"
  pull_request:
    paths: *site-inputs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The repo's pinned Playwright Chromium rather than the runner's Chrome,
      # which the image updates under us.
      - name: Install Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -p "require('@playwright/test').chromium.executablePath()")" >> "$GITHUB_ENV"

      - name: Run site quality checks
        run: pnpm exec turbo run lighthouse --filter=@velachess/site

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: apps/site/.lighthouseci
          if-no-files-found: ignore
