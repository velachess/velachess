name: Site quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Site changes
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Any git failure (a force-pushed or first push has no usable base)
      # lands in the else branch and runs Lighthouse.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE...HEAD" -- \
            apps/site \
            libs/ui/package.json libs/ui/src/components libs/ui/src/icons libs/ui/src/lib libs/ui/src/styles \
            package.json pnpm-lock.yaml pnpm-workspace.yaml .node-version turbo.json \
            .github/actions/setup .github/workflows/site-quality.yml \
            ':(exclude,glob)**/*.md' ':(exclude,glob)**/tests/**' ':(exclude,glob)**/*.test.ts' ':(exclude,glob)**/*.test.tsx'
          then
            echo "site=false" >> "$GITHUB_OUTPUT"
          else
            echo "site=true" >> "$GITHUB_OUTPUT"
          fi

  lighthouse:
    name: Lighthouse
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -p "require('@playwright/test').chromium.executablePath()")" >> "$GITHUB_ENV"

      - name: Run site quality checks
        run: pnpm exec turbo run lighthouse --filter=@velachess/site

      - name: Annotate results
        if: always() && hashFiles('apps/site/.lighthouseci/assertion-results.json') != ''
        working-directory: apps/site/.lighthouseci
        run: |
          jq -r '"::notice title=Run::benchmark index \(.environment.benchmarkIndex | round), performance \(.categories.performance.score), TBT \(.audits["total-blocking-time"].numericValue | round) ms, LCP \(.audits["largest-contentful-paint"].numericValue | round) ms"' lhr-*.json
          jq -r '.[] | "::\(if .level == "error" then "error" else "warning" end) title=\(.auditId)\(if .auditProperty then ":" + .auditProperty else "" end)::\(.operator) \(.expected), found \(.actual), runs \(.values | map(round) | join(" "))"' assertion-results.json

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: apps/site/.lighthouseci
          if-no-files-found: ignore

  gate:
    name: Site quality
    needs: [changes, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.result != 'success' || (needs.changes.outputs.site == 'true' && needs.lighthouse.result != 'success')
        run: exit 1
