# Global composition — everything that spans the whole system lives here;
# each app's own image recipe lives next to the app (apps/*/Dockerfile).
# Run from the repo root:
#   docker compose -f docker/docker-compose.yml up
name: velachess

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velachess
      POSTGRES_PASSWORD: velachess
      POSTGRES_DB: velachess
    ports:
      - "5434:5432"
    volumes:
      - velachess_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velachess"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API's rate-limit counters, shared across api replicas.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - velachess_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot release step: applies pending drizzle migrations, then exits.
  # api and worker only start after it succeeds — `up` always boots on a
  # migrated schema. Idempotent: an already-migrated db is a fast no-op.
  migrate:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: "no"
    command: ["pnpm", "--filter", "@velachess/infra-db", "db:migrate"]
    environment:
      DATABASE_URL: postgres://velachess:velachess@postgres:5432/velachess
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://velachess:velachess@postgres:5432/velachess
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      # Self-hosted auth: everything local, no VelaChess cloud involved.
      # Both required values fail fast here AND at boot — the server
      # validates its own env (libs/infra/auth/env.ts) so compose is a
      # convenience, not the security boundary.
      VELACHESS_AUTH_SECRET: ${VELACHESS_AUTH_SECRET:?set a random 32+ char secret — openssl rand -base64 32}
      # Explicit, no default: the image runs NODE_ENV=production, where a
      # silently-defaulted base URL is refused at boot anyway.
      VELACHESS_BASE_URL: ${VELACHESS_BASE_URL:?set the public URL, e.g. http://localhost:3000}
      VELACHESS_TRUSTED_ORIGINS: ${VELACHESS_TRUSTED_ORIGINS:-}
      # Google sign-in: both or neither (libs/infra/auth/env.ts refuses to
      # boot with only one set).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Reverse proxies in front of this container, if any — see
      # docs/how-to/self-host.md#behind-a-reverse-proxy.
      VELACHESS_TRUSTED_PROXIES: ${VELACHESS_TRUSTED_PROXIES:-}
      # TEMPORARY: first boot creates this user into an empty user table;
      # later boots skip. Deliberately optional — the lifecycle ends with
      # removing both from .env after first login (docs/how-to/self-host.md,
      # step 6), and an installation with users ignores them either way.
      VELACHESS_BOOTSTRAP_USER_EMAIL: ${VELACHESS_BOOTSTRAP_USER_EMAIL:-}
      VELACHESS_BOOTSTRAP_USER_PASSWORD: ${VELACHESS_BOOTSTRAP_USER_PASSWORD:-}
      # Uploaded files — profile pictures today. Absolute, and a mount
      # point rather than a path in the image: the library refuses a
      # relative root in production precisely because that writes into the
      # container layer, where `up --build` deletes it.
      VELACHESS_STORAGE_DIR: /data
    volumes:
      - velachess_files:/data
    ports:
      # Host side overridable — 3000 is a popular port (AdGuard, Grafana…).
      # The container always listens on 3000; point VITE_API_TARGET at
      # whatever host port you pick.
      - "${VELACHESS_API_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://velachess:velachess@postgres:5432/velachess
      WORKER_ANALYSIS_CONCURRENCY: "4"
      ANALYSIS_DEPTH: "12"
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-3003}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.WORKER_HEALTH_PORT + '/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  velachess_pgdata:
  # Belongs in the backup set alongside the database: losing it degrades
  # every custom avatar to initials, which the UI handles, but the images
  # are gone.
  velachess_files:
  # Rate-limit counters only — no backup needed; losing it resets every
  # budget to empty.
  velachess_redisdata:
