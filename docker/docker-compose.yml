# Run from the repo root: docker compose -f docker/docker-compose.yml up
name: velachess

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velachess
      POSTGRES_PASSWORD: velachess
      POSTGRES_DB: velachess
    ports:
      - "5434:5432"
    volumes:
      - velachess_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velachess"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API's rate-limit counters, shared across api replicas.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - velachess_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies pending migrations, then exits; api and worker wait for it.
  migrate:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: "no"
    command: ["pnpm", "--filter", "@velachess/infra-db", "db:migrate"]
    environment:
      DATABASE_URL: postgres://velachess:velachess@postgres:5432/velachess
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://velachess:velachess@postgres:5432/velachess
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      VELACHESS_AUTH_SECRET: ${VELACHESS_AUTH_SECRET:?set a random 32+ char secret — openssl rand -base64 32}
      VELACHESS_BASE_URL: ${VELACHESS_BASE_URL:?set the public URL, e.g. http://localhost:3000}
      VELACHESS_TRUSTED_ORIGINS: ${VELACHESS_TRUSTED_ORIGINS:-}
      # Both or neither.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Both or neither.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      VELACHESS_EMAIL_FROM: ${VELACHESS_EMAIL_FROM:-}
      VELACHESS_PASSWORD_SIGN_IN: ${VELACHESS_PASSWORD_SIGN_IN:-true}
      # Needs Resend.
      VELACHESS_MAGIC_LINK: ${VELACHESS_MAGIC_LINK:-false}
      VELACHESS_TRUSTED_PROXIES: ${VELACHESS_TRUSTED_PROXIES:-}
      # First user only; remove from .env after first login.
      VELACHESS_BOOTSTRAP_USER_EMAIL: ${VELACHESS_BOOTSTRAP_USER_EMAIL:-}
      VELACHESS_BOOTSTRAP_USER_PASSWORD: ${VELACHESS_BOOTSTRAP_USER_PASSWORD:-}
      # Must be a mounted volume: the container layer is lost on rebuild.
      VELACHESS_STORAGE_DIR: /data
    volumes:
      - velachess_files:/data
    ports:
      # Host port overridable; point VITE_API_TARGET at it.
      - "${VELACHESS_API_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://velachess:velachess@postgres:5432/velachess
      WORKER_ANALYSIS_CONCURRENCY: "4"
      ANALYSIS_DEPTH: "12"
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-3003}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.WORKER_HEALTH_PORT + '/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  velachess_pgdata:
  # Back up with the database: it holds uploaded avatars.
  velachess_files:
  # Rate-limit counters only; no backup needed.
  velachess_redisdata:
